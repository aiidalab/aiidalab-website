{% if site.announcement.enabled %}
<div class="announcement-banner" role="region" aria-label="Announcement">
  <div class="announcement-content">
    <span class="announcement-label">
      {{ site.announcement.label | escape }}
    </span>

    <span class="announcement-message">
      {{ site.announcement.message | escape }}
    </span>

    {% if site.announcement.url and site.announcement.link_text %}
    <a href="{{ site.announcement.url | escape }}">
      {{ site.announcement.link_text | escape }} &rarr;
    </a>
    {% endif %}
  </div>
</div>
{% endif %}
